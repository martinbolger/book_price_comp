[project]
name = "database"
version = "0.1.0"
description = "Scrapes book sales data to identify arbitrage opportunities"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "psycopg2-binary",
    "sqlalchemy>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "alembic>=1.18.4"
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"
