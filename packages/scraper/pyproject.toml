[project]
name = "scraper"
version = "0.1.0"
description = "Scrapes book sales data"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "pandas>=3.0.2",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.3",
    "requests>=2.33.0",
    "boto3",
    "database"
]

[tool.uv.sources]
database = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3"
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"
