[project]
name = "labeler"
version = "0.1.0"
description = "Labels book data"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "xai_sdk",
    "database"
]

[tool.uv.sources]
database = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3"
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"
